<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>THE QUADRATURE // PHYSIOLOGICAL VECTOR</title>
    
    <script src="q-ui.js"></script>
    <script src="q-core.js"></script>
    <script src="q-planner.js"></script>
    <script src="q-hub.js"></script>
    <script src="physiological.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;400;700&family=Orbitron:wght@400;500;700;900&display=swap');

        :root {
            --void: #05080f; 
            --bio-purple: #b829ff; 
            --bio-purple-dim: rgba(184, 41, 255, 0.2);
            --bio-cobalt: #0055ff;
            --sys-cyan: #00f0ff;
            --warn-orange: #ffaa00; 
            --chrono-amber: #B97A35;
            --friction-red: #ff3333;
            --theme-main: var(--bio-purple); /* Restored OS baseline */
            --theme-dim: var(--bio-purple-dim);
            --os-grey: #888888;
        }

        body { 
            margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden; 
            background-color: var(--void); 
            background: radial-gradient(circle at center, #0f0a1c 0%, var(--void) 90%); 
            color: #fff; font-family: 'JetBrains Mono', monospace; display: flex; 
            justify-content: center; align-items: center; user-select: none; 
            color-scheme: dark; perspective: 1500px; transform-style: preserve-3d; 
            touch-action: manipulation;
        }

        .global-header {
            position: absolute; top: 4vh; left: 0; width: 100vw;
            display: flex; justify-content: center; align-items: center; text-align: center;
            font-family: 'Courier New', Courier, monospace; font-weight: 900; font-size: 2.8rem; letter-spacing: 16px; padding-left: 16px;
            color: var(--theme-main); z-index: 50; pointer-events: none;
            text-shadow: 0 0 15px var(--theme-dim), 0 0 5px rgba(255, 255, 255, 0.5);
        }

        .v-head { 
            position: absolute; white-space: nowrap;
            font-family: 'Orbitron'; font-weight: 900; font-size: 0.75rem; letter-spacing: 2px; 
            margin: 0; padding: 0; z-index: 25; border: none;
            color: var(--theme-main);
            text-shadow: 0 0 10px var(--theme-dim);
        }
        
        #quad-tl .v-head { bottom: -16px; right: 0; text-align: right; transform: translateX(-8px); }
        #quad-tr .v-head { bottom: -16px; left: 0; text-align: left; transform: translateX(8px); }
        #quad-bl .v-head { top: -16px; right: 0; text-align: right; transform: translateX(-8px); }
        #quad-br .v-head { top: -16px; left: 0; text-align: left; transform: translateX(8px); }

        .t-row { display: flex; justify-content: space-between; width: 100%; font-size: 0.55rem; font-family: 'JetBrains Mono'; font-weight: 700; align-items: center;}
        .val-sm { font-family: 'Orbitron'; font-weight: 700; font-size: 0.6rem; z-index: 20; text-align: right; white-space: nowrap; color: var(--theme-main); text-shadow: 0 0 10px var(--theme-dim); text-transform: uppercase; }

        .bar-bg { width: 100%; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; margin-top: 4px; }
        .bar-fill { height: 100%; background: var(--theme-main); width: 0%; box-shadow: 0 0 10px var(--theme-main); transition: width 0.1s linear; }

        /* PROPRIOCEPTIVE EYE ARCHITECTURE */
        .q-physio-dial { position: absolute; width: 450px; height: 450px; display: flex; justify-content: center; align-items: center; z-index: 5; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; }
        
        .ring { position: absolute; border-radius: 50%; display: flex; justify-content: center; align-items: center; transition: all 0.5s ease; pointer-events: auto; cursor: crosshair; }
        
        /* 1. The Sclera (Outer Boundary & Base Plate - Blocks Stars, Catches Hover) */
        #tension-sclera { width: 100%; height: 100%; z-index: 2; background: var(--void); border: 1px solid rgba(255,255,255,0.05); }
        #tension-sclera.tension-high { border-color: var(--friction-red); box-shadow: 0 0 30px var(--friction-red), inset 0 0 30px var(--friction-red); animation: friction-pulse 1.5s infinite alternate; }

        @keyframes friction-pulse {
            from { box-shadow: 0 0 10px var(--friction-red), inset 0 0 10px var(--friction-red); }
            to { box-shadow: 0 0 40px var(--friction-red), inset 0 0 40px var(--friction-red); }
        }

        /* 2. The Iris (Thermal Band / Internal Clock) */
        #thermal-iris { width: 65%; height: 65%; z-index: 3; opacity: 0.8; top: 17.5%; left: 17.5%; border: 1px solid rgba(255,255,255,0.05); }
        
        /* Thermodynamic Spectral Palette */
        .flow-aura { background: radial-gradient(circle, var(--sys-cyan) 0%, transparent 70%); box-shadow: 0 0 60px var(--sys-cyan); }
        .vent-aura { background: radial-gradient(circle, var(--os-grey) 0%, transparent 70%); box-shadow: 0 0 60px var(--os-grey); animation: breath 4s infinite ease-in-out; }
        .sleep-aura { background: radial-gradient(circle, var(--bio-purple) 0%, transparent 70%); box-shadow: 0 0 30px var(--bio-purple); opacity: 0.3; }
        .inertia-aura { background: radial-gradient(circle, var(--chrono-amber) 0%, transparent 70%); box-shadow: 0 0 60px var(--chrono-amber); }
        .dlmo-aura { background: radial-gradient(circle, var(--bio-cobalt) 0%, transparent 70%); box-shadow: 0 0 60px var(--bio-cobalt); animation: breath 6s infinite ease-in-out; }

        @keyframes breath {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.05); opacity: 0.9; }
        }

        /* 3. The Pupil (Ultradian Energy Aperture) */
        #ultradian-pupil { width: 30%; height: 30%; background: #000; box-shadow: inset 0 0 20px rgba(255,255,255,0.1), 0 0 20px #000; z-index: 4; border: 2px solid rgba(255,255,255,0.05); top: 35%; left: 35%; }

        /* 4. Eyelid Mask & Eyelid (Isolated to prevent breaking Iris/Pupil/Sclera hovers) */
        .eye-mask { position: absolute; width: 100%; height: 100%; border-radius: 50%; overflow: hidden; z-index: 5; pointer-events: none; }
        
        #readiness-eyelid { position: absolute; top: 0; left: 0; width: 100%; background: rgba(5,8,15,0.98); z-index: 6; transition: height 0.8s ease-in-out; pointer-events: auto; border-bottom: 2px solid var(--os-grey); border-radius: 0 !important; cursor: crosshair; }
        
        .eyelid-open { height: 12%; border-bottom-color: var(--os-grey); } /* Permanent geometric footprint */
        .eyelid-half { height: 50%; border-bottom-color: var(--bio-cobalt); box-shadow: 0 15px 30px rgba(0,0,0,0.9); }
        .eyelid-closed { height: 100%; border-bottom-color: transparent; }
        
        /* Native Hardware Tooltips */
        .ring:hover::after, #readiness-eyelid:hover::after {
            content: attr(data-desc);
            position: absolute;
            background: rgba(0,0,0,0.95);
            border: 1px solid var(--theme-main);
            color: #fff;
            padding: 8px 12px;
            font-family: 'JetBrains Mono';
            font-size: 0.65rem;
            white-space: nowrap;
            border-radius: 4px;
            z-index: 100;
            pointer-events: none;
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(0,0,0,1);
        }

        /* Placement Rules */
        #tension-sclera:hover::after { bottom: -45px; left: 50%; transform: translateX(-50%); }
        #thermal-iris:hover::after { bottom: -110px; left: 50%; transform: translateX(-50%); }
        #ultradian-pupil:hover::after { bottom: -190px; left: 50%; transform: translateX(-50%); }
        
        /* Eyelid tooltip placed inside the lid so it is not clipped by the mask */
        #readiness-eyelid:hover::after { top: 12px; left: 50%; transform: translateX(-50%); border-color: var(--os-grey); }

    </style>
</head>
<body class="mode-q">

    <div class="global-header desktop-only">PHYSIOLOGICAL</div>

    <div class="q-physio-dial">
        <div id="tension-sclera" class="ring" data-desc="SCLERA: Calendar Friction vs Biologic Rhythm"></div>
        
        <div id="thermal-iris" class="ring iris-band" data-desc="IRIS: Metabolic State & Thermal Proxy"></div>
        
        <div id="ultradian-pupil" class="ring" data-desc="PUPIL: Cognitive Bandwidth Aperture"></div>
        
        <div class="eye-mask">
            <div id="readiness-eyelid" class="eyelid-open" data-desc="EYELID: Readiness State & Sleep Guard"></div>
        </div>
    </div>

</body>
</html>
