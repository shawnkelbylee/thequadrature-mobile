<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q Logic Library</title>
    <style>
        body { 
            background: #05080f; 
            color: #ccc; 
            font-family: 'JetBrains Mono', monospace; 
            padding: 2rem; 
            margin: 0;
        }
        .library-container { 
            max-width: 800px; 
            margin: 0 auto; 
        }
        h1 { 
            color: #00f0ff; 
            text-align: center; 
            font-family: 'Orbitron', sans-serif; 
            border-bottom: 1px dashed rgba(0,240,255,0.5); 
            padding-bottom: 1rem; 
            letter-spacing: 2px;
        }
        .manuscript-card { 
            border: 1px solid rgba(255,255,255,0.1); 
            padding: 1.5rem; 
            margin-bottom: 1rem; 
            border-radius: 4px; 
            background: rgba(0,0,0,0.5); 
            transition: 0.3s; 
        }
        .manuscript-card:hover { 
            border-color: #00f0ff; 
            box-shadow: inset 0 0 15px rgba(0,240,255,0.1); 
        }
        .manuscript-title { 
            font-family: 'Orbitron', sans-serif; 
            color: #fff; 
            font-size: 1.2rem; 
            margin-bottom: 0.5rem; 
            text-transform: uppercase;
        }
        .manuscript-type { 
            font-size: 0.7rem; 
            color: #b829ff; 
            font-weight: bold; 
            margin-bottom: 1rem; 
            letter-spacing: 1px; 
        }
        .manuscript-desc { 
            font-size: 0.85rem; 
            margin-bottom: 1.5rem; 
            line-height: 1.5;
        }
        .read-btn { 
            background: rgba(0,0,0,0.8); 
            border: 1px solid #00f0ff; 
            color: #00f0ff; 
            padding: 10px 18px; 
            font-family: 'Orbitron', sans-serif; 
            font-size: 0.8rem; 
            font-weight: bold;
            cursor: pointer; 
            transition: 0.3s; 
            text-decoration: none; 
            display: inline-block; 
            letter-spacing: 1px;
        }
        .read-btn:hover { 
            background: #00f0ff; 
            color: #000; 
            box-shadow: 0 0 10px rgba(0,240,255,0.5);
        }
        .back-btn { 
            display: block; 
            margin: 3rem auto; 
            text-align: center; 
            color: rgba(255,255,255,0.6); 
            text-decoration: none; 
            font-size: 0.8rem; 
            font-family: 'Orbitron', sans-serif;
            transition: 0.3s;
        }
        .back-btn:hover { 
            color: #fff; 
            text-shadow: 0 0 8px rgba(255,255,255,0.5);
        }
    </style>
</head>
<body>
    <div class="library-container">
        <h1>THE QUADRATURE // MANUSCRIPT ARCHIVE</h1>
        <div id="archive-grid"></div>
        <a href="index.html" class="back-btn" onclick="if(window.history.length > 1) { window.history.back(); return false; }">[ RETURN TO APERTURE ]</a>
    </div>

    <script src="q-library-data.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const grid = document.getElementById('archive-grid');
            
            if (window.Q_MANUSCRIPTS && window.Q_MANUSCRIPTS.length > 0) {
                window.Q_MANUSCRIPTS.forEach(doc => {
                    grid.innerHTML += `
                        <div class="manuscript-card">
                            <div class="manuscript-title">${doc.title}</div>
                            <div class="manuscript-type">[ ${doc.type} ] | ACCESS: ${doc.access}</div>
                            <div class="manuscript-desc">${doc.desc}</div>
                            <a href="${doc.url}" class="read-btn">INITIALIZE READER</a>
                        </div>
                    `;
                });
            } else {
                grid.innerHTML = '<div style="text-align:center; color:#ff4444; font-family:\'Orbitron\'; padding: 2rem; border: 1px dashed #ff4444;">[ ERROR: DATA MATRIX UNREACHABLE OR EMPTY ]<br><br>Verify q-library-data.js is present in the root directory.</div>';
            }
        });
    </script>
</body>
</html>
