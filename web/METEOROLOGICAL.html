<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>THE QUADRATURE // METEOROLOGICAL VECTOR</title>
    
    <script src="q-ui.js"></script>
    <script src="q-core.js"></script>
    <script src="q-planner.js"></script>
    <script src="q-hub.js"></script>
    <script src="meteorological.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=JetBrains+Mono:wght@100;400;700&display=swap');

        :root {
            --void: #020617; 
            --atmos-blue: #0ea5e9; 
            --atmos-dim: rgba(14, 165, 233, 0.15);
            --squall-amber: #f59e0b; 
            --alert-red: #ef4444; 
            --perihelion-mag: #c026d3;
            --env-green: #a7ff83; 
            --env-green-dim: rgba(167, 255, 131, 0.2); 
            --env-green-glow: rgba(167, 255, 131, 0.4);
            --theme-main: var(--env-green); 
            --theme-dim: var(--env-green-dim); 
            --gold: #F4D068;
            --platinum: #E5E4E2;
            --white-pure: #ffffff;
            --starlight: rgba(255, 255, 255, 0.6);
        }

        body { 
            margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden; 
            background-color: var(--void); 
            background: radial-gradient(circle at center, #0a1122 0%, var(--void) 100%); 
            color: var(--env-green); font-family: 'JetBrains Mono', monospace; 
            display: flex; justify-content: center; align-items: center; 
            user-select: none; perspective: 1500px; transform-style: preserve-3d; color-scheme: dark; 
            touch-action: manipulation;
        }

        .global-header {
            position: absolute; top: 4vh; left: 0; width: 100vw;
            display: flex; justify-content: center; align-items: center; text-align: center;
            font-family: 'Courier New', Courier, monospace; font-weight: 900; font-size: 2.8rem; letter-spacing: 16px; padding-left: 16px;
            color: var(--theme-main); z-index: 50; pointer-events: none;
            text-shadow: 0 0 15px var(--theme-dim), 0 0 5px rgba(255, 255, 255, 0.5);
        }

        /* DYNAMIC CORNER PANELS INJECTED BY Q-UI.JS - DO NOT HARDCODE HERE */

        /* --- MOBILE GEOMETRY & DIAL BOUNDARIES --- */
        .master-wheel-container { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85vmin; max-width: 400px; aspect-ratio: 1/1; display: flex; justify-content: center; align-items: center; z-index: 5; }
        .wheel-glass { position: absolute; width: 100%; height: 100%; border-radius: 50%; background: radial-gradient(circle, rgba(167, 255, 131, 0.02) 0%, rgba(14, 165, 233, 0.05) 60%, rgba(2, 6, 23, 0.6) 100%); backdrop-filter: blur(8px); border: 1px solid var(--env-green-dim); box-shadow: 0 0 60px var(--env-green-dim), inset 0 0 40px rgba(0,0,0,0.8); pointer-events: none; }
        
        /* Decorative UI Rings */
        .wheel-ring { position: absolute; border-radius: 50%; display: flex; justify-content: center; align-items: center; pointer-events: none; }
        .r-outer { width: 95%; height: 95%; border: 2px solid var(--env-green); opacity: 0.7; box-shadow: 0 0 15px var(--env-green-glow), inset 0 0 20px rgba(0,0,0,0.5); }
        .r-mid { width: 78%; height: 78%; background: conic-gradient(from 0deg, var(--void) 0deg, var(--env-green) 45deg, var(--void) 90deg, var(--env-green) 135deg, var(--void) 180deg, var(--env-green) 225deg, var(--void) 270deg, var(--env-green) 315deg, var(--void) 360deg); -webkit-mask: radial-gradient(transparent 65%, black 66%); opacity: 0.8; box-shadow: inset 0 0 20px rgba(0,0,0,0.8); }
        .r-inner { width: 55%; height: 55%; border: 2px solid var(--env-green-dim); box-shadow: 0 0 0 1px var(--env-green), inset 0 0 30px var(--env-green-dim); background: rgba(0,0,0,0.4); }
        .horizon-cone { position: absolute; top: -10px; width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-bottom: 30px solid var(--env-green); filter: drop-shadow(0 -5px 15px var(--env-green)); }

        /* --- THE ECLIPTIC-ANCHORED DIURNAL GLOBE --- */
        .q-meteo-globe { position: absolute; width: 65%; height: 65%; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 40; border-radius: 50%; box-shadow: 0 0 30px rgba(14, 165, 233, 0.2); background-color: #020813; }
        
        /* 0-Degree Vertical Axis Line */
        .globe-axis-line { position: absolute; width: 2px; height: 130%; top: -15%; left: 50%; transform: translateX(-50%); background: linear-gradient(to bottom, transparent, var(--atmos-blue), transparent); z-index: 10; opacity: 0.7; box-shadow: 0 0 10px var(--atmos-dim); pointer-events: none; }
        
        /* Earth Surface (0-Degree Vertical) */
        .globe-sphere { position: absolute; width: 100%; height: 100%; top: 0; left: 0; border-radius: 50%; overflow: hidden; }
        .globe-surface { position: absolute; width: 200%; height: 100%; top: 0; left: 0; background-image: url('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_atmos_2048.jpg'); background-size: auto 100%; background-repeat: repeat-x; transition: background-position 0.1s linear; }
        
        /* The 3D Sweeping Solar Shadow */
        .globe-terminator-container { position: absolute; width: 100%; height: 100%; top: 0; left: 0; border-radius: 50%; overflow: hidden; pointer-events: none; z-index: 3; }
        .globe-terminator { position: absolute; width: 200%; height: 100%; top: 0; left: 0; mix-blend-mode: multiply; transition: transform 0.1s linear; }
        
        /* Overscaled repeating gradient ensures the globe never hits a void edge during the 24h sweep */
        .globe-terminator::before {
            content: ''; position: absolute; width: 300%; height: 100%; top: 0; left: 0;
            background: repeating-linear-gradient(to right,
                rgba(0,0,0,0.98) 0%, rgba(0,0,0,0.7) 12.5%,
                transparent 25%, transparent 75%,
                rgba(0,0,0,0.7) 87.5%, rgba(0,0,0,0.98) 100%
            );
            background-size: 33.333% 100%; 
        }
        
        /* Permanent Volumetric Inset to simulate a physical sphere regardless of terminator position */
        .globe-volumetric { position: absolute; width: 100%; height: 100%; top: 0; left: 0; border-radius: 50%; box-shadow: inset -15px -15px 40px rgba(0,0,0,0.9), inset 5px 5px 20px rgba(255,255,255,0.15); z-index: 4; pointer-events: none; }
        
        #axis-hud { position: absolute; top: 12vh; left: 50%; transform: translateX(-50%); background: rgba(2, 6, 15, 0.9); border: 1px solid var(--env-green); padding: 8px 16px; font-family: 'Orbitron'; font-size: 0.75rem; font-weight: bold; color: var(--env-green); border-radius: 4px; box-shadow: 0 0 15px var(--env-green-dim); z-index: 100; opacity: 0; transition: opacity 0.3s ease; text-align: center; pointer-events: none; letter-spacing: 2px; }
    </style>
</head>
<body class="mode-q">

    <div class="global-header desktop-only">METEOROLOGICAL</div>
    <div class="matrix-layer"></div>
    <div id="axis-hud">ECLIPTIC TRACKING ACTIVE</div>

    <div class="master-wheel-container q-center-dial">
        <div class="wheel-glass"></div>
        
        <div class="q-meteo-globe" onmouseover="if(window.showAxisHUD) window.showAxisHUD('ECLIPTIC DIURNAL ENGINE: VERTICAL AXIS / Y-SHIFT')" onmouseout="if(window.hideAxisHUD) window.hideAxisHUD()">
            <div class="globe-axis-line"></div>
            
            <div class="globe-sphere">
                <div class="globe-surface" id="diurnal-surface"></div>
            </div>
            
            <div class="globe-terminator-container">
                <div class="globe-terminator" id="diurnal-terminator"></div>
            </div>
            
            <div class="globe-volumetric"></div>
        </div>

        <div class="wheel-ring r-outer"></div>
        <div class="wheel-ring r-mid"></div>
        <div class="wheel-ring r-inner" id="action-horizon-ring"><div class="horizon-cone"></div></div>
    </div>

</body>
</html>
