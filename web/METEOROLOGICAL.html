<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>THE QUADRATURE // METEOROLOGICAL VECTOR</title>
    
    <script src="q-ui.js"></script>
    <script src="q-core.js"></script>
    <script src="q-planner.js"></script>
    <script src="q-hub.js"></script>
    <script src="meteorological.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=JetBrains+Mono:wght@100;400;700&display=swap');

        :root {
            --void: #020617; 
            --atmos-blue: #0ea5e9; 
            --atmos-dim: rgba(14, 165, 233, 0.15);
            --squall-amber: #f59e0b; 
            --alert-red: #ef4444; 
            --perihelion-mag: #c026d3;
            --env-green: #a7ff83; 
            --env-green-dim: rgba(167, 255, 131, 0.2); 
            --env-green-glow: rgba(167, 255, 131, 0.4);
            --theme-main: var(--env-green); 
            --theme-dim: var(--env-green-dim); 
        }

        body { 
            margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden; 
            background-color: var(--void); 
            background: radial-gradient(circle at center, #0a1122 0%, var(--void) 100%); 
            color: var(--env-green); font-family: 'JetBrains Mono', monospace; 
            display: flex; justify-content: center; align-items: center; 
            user-select: none; perspective: 1500px; transform-style: preserve-3d; color-scheme: dark; 
            touch-action: manipulation;
        }

        .global-header {
            position: absolute; top: 4vh; left: 0; width: 100vw;
            display: flex; justify-content: center; align-items: center; text-align: center;
            font-family: 'Courier New', Courier, monospace; font-weight: 900; font-size: 2.8rem; letter-spacing: 16px; padding-left: 16px;
            color: var(--theme-main); z-index: 50; pointer-events: none;
            text-shadow: 0 0 15px var(--theme-dim), 0 0 5px rgba(255, 255, 255, 0.5);
        }

        /* --- CORNER PANELS --- */
        .corner-panel { position: absolute; width: 280px; height: 120px; z-index: 30; border: 1px solid var(--theme-dim); background: rgba(2, 6, 23, 0.6); backdrop-filter: blur(8px); box-shadow: 0 0 20px rgba(0,0,0,0.5), inset 0 0 15px var(--theme-dim); padding: 12px; display: flex; flex-direction: column; justify-content: center; cursor: pointer; transition: 0.3s; }
        .corner-panel:hover { border-color: var(--theme-main); box-shadow: 0 0 20px var(--theme-dim), inset 0 0 20px rgba(167, 255, 131, 0.1); }
        
        #quad-tl { top: 4vh; left: 2vw; border-top-left-radius: 12px; border-bottom-right-radius: 24px; }
        #quad-tr { top: 4vh; right: 2vw; border-top-right-radius: 12px; border-bottom-left-radius: 24px; }
        #quad-bl { bottom: 4vh; left: 2vw; border-bottom-left-radius: 12px; border-top-right-radius: 24px; }
        #quad-br { bottom: 4vh; right: 2vw; border-bottom-right-radius: 12px; border-top-left-radius: 24px; }

        .v-head { position: absolute; white-space: nowrap; font-family: 'Orbitron'; font-weight: 900; font-size: 0.75rem; letter-spacing: 2px; margin: 0; padding: 0; z-index: 25; color: var(--theme-main); text-shadow: 0 0 10px var(--theme-dim); }
        #quad-tl .v-head { bottom: -16px; right: 0; text-align: right; transform: translateX(8px); }
        #quad-tr .v-head { bottom: -16px; left: 0; text-align: left; transform: translateX(-8px); }
        #quad-bl .v-head { top: -16px; right: 0; text-align: right; transform: translateX(8px); }
        #quad-br .v-head { top: -16px; left: 0; text-align: left; transform: translateX(-8px); }

        .panel-data-wrapper { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 4px; z-index: 20; }
        .opt-oval { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: var(--theme-dim); border: 1px solid var(--theme-main); z-index: 40; transition: 0.3s; }
        #quad-tl .opt-oval { bottom: -4px; right: -4px; }
        #quad-tr .opt-oval { bottom: -4px; left: -4px; }
        #quad-bl .opt-oval { top: -4px; right: -4px; }
        #quad-br .opt-oval { top: -4px; left: -4px; }

        /* THE ECLIPTIC-ANCHORED DIURNAL GLOBE */
        .master-wheel-container { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85vmin; max-width: 400px; aspect-ratio: 1/1; display: flex; justify-content: center; align-items: center; z-index: 5; }
        .wheel-glass { position: absolute; width: 100%; height: 100%; border-radius: 50%; background: radial-gradient(circle, rgba(167, 255, 131, 0.02) 0%, rgba(14, 165, 233, 0.05) 60%, rgba(2, 6, 23, 0.6) 100%); backdrop-filter: blur(8px); border: 1px solid var(--env-green-dim); box-shadow: 0 0 60px var(--env-green-dim), inset 0 0 40px rgba(0,0,0,0.8); pointer-events: none; }
        
        .q-meteo-globe { position: absolute; width: 70%; height: 70%; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 40; perspective: 1000px; transform-style: preserve-3d; }
        
        /* The Earth Axis and Surface (Tilted 23.5) */
        .globe-axis-line { position: absolute; width: 2px; height: 140%; top: -20%; left: 50%; background: linear-gradient(to bottom, transparent, var(--atmos-blue), transparent); transform: rotate(23.5deg); z-index: 1; opacity: 0.7; box-shadow: 0 0 10px var(--atmos-dim); }
        .globe-sphere { position: absolute; width: 100%; height: 100%; top: 0; left: 0; border-radius: 50%; overflow: hidden; background-color: #020813; transform: rotate(23.5deg); box-shadow: inset -5px -5px 20px rgba(0,0,0,0.9); }
        .globe-surface { position: absolute; width: 100%; height: 100%; top: 0; left: 0; background-image: url('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_atmos_2048.jpg'); background-size: cover; background-repeat: repeat-x; transition: background-position 0.1s linear; }
        
        /* The Solar Terminator & Volumetrics (Untilted, Perpendicular to Ecliptic) */
        .globe-terminator-container { position: absolute; width: 100%; height: 100%; top: 0; left: 0; border-radius: 50%; overflow: hidden; z-index: 3; pointer-events: none; }
        .globe-terminator { position: absolute; width: 200%; height: 100%; top: 0; left: 0; background: linear-gradient(to right, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.8) 40%, transparent 50%, rgba(0,0,0,0.8) 60%, rgba(0,0,0,0.95) 100%); mix-blend-mode: multiply; transition: transform 0.1s linear; }
        .globe-volumetric { position: absolute; width: 100%; height: 100%; top: 0; left: 0; border-radius: 50%; background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.15) 0%, transparent 60%); box-shadow: inset 2px 2px 15px rgba(255,255,255,0.2); z-index: 4; pointer-events: none; }
        
        #axis-hud { position: absolute; top: 12vh; left: 50%; transform: translateX(-50%); background: rgba(2, 6, 15, 0.9); border: 1px solid var(--env-green); padding: 8px 16px; font-family: 'Orbitron'; font-size: 0.75rem; font-weight: bold; color: var(--env-green); border-radius: 4px; box-shadow: 0 0 15px var(--env-green-dim); z-index: 100; opacity: 0; transition: opacity 0.3s ease; text-align: center; pointer-events: none; letter-spacing: 2px; }
    </style>
</head>
<body class="mode-q">

    <div class="global-header desktop-only">METEOROLOGICAL</div>
    <div class="matrix-layer"></div>
    <div id="axis-hud">ECLIPTIC TRACKING ACTIVE</div>

    <div id="quad-tl" class="corner-panel"><h2 class="v-head">INSOLATION</h2><div class="panel-data-wrapper" id="pnl-insolation"></div><div class="opt-oval" id="opt-tl"></div></div>
    <div id="quad-tr" class="corner-panel"><h2 class="v-head">HYDROSPHERE</h2><div class="panel-data-wrapper" id="pnl-hydro"></div><div class="opt-oval" id="opt-tr"></div></div>
    <div id="quad-bl" class="corner-panel"><h2 class="v-head">TROPOSPHERE</h2><div class="panel-data-wrapper" id="pnl-tropo"></div><div class="opt-oval" id="opt-bl"></div></div>
    <div id="quad-br" class="corner-panel"><h2 class="v-head">STRATOSPHERE</h2><div class="panel-data-wrapper" id="pnl-strato"></div><div class="opt-oval" id="opt-br"></div></div>

    <div class="master-wheel-container q-center-dial">
        <div class="wheel-glass"></div>
        
        <div class="q-meteo-globe" onmouseover="if(window.showAxisHUD) window.showAxisHUD('ECLIPTIC LOCK: 23.5° TILT / SEASONAL WOBBLE')" onmouseout="if(window.hideAxisHUD) window.hideAxisHUD()">
            <div class="globe-axis-line"></div>
            
            <div class="globe-sphere">
                <div class="globe-surface" id="diurnal-surface"></div>
            </div>
            
            <div class="globe-terminator-container">
                <div class="globe-terminator" id="diurnal-terminator"></div>
            </div>
            
            <div class="globe-volumetric"></div>
        </div>
    </div>

</body>
</html>
