<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>THE QUADRATURE // ASTROPHYSICAL VECTOR</title>
    
    <script src="q-ui.js"></script>
    <script src="q-core.js"></script>
    <script src="q-planner.js"></script>
    <script src="q-hub.js"></script>
    <script src="astrophysical.js?v=29.0"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=JetBrains+Mono:wght@100;400;700;800&display=swap');

        :root {
            --void: #030406; --core-plat: #e2e8f0; --core-dim: rgba(226, 232, 240, 0.15);
            --cyan-glow: #00f0ff; --cyan-dim: rgba(0, 240, 255, 0.2);
            --magenta-glow: #ff003c; --magenta-dim: rgba(255, 0, 60, 0.2);
            --titanium: #334155; --steel: #64748b;
            --gold: #F4D068; --silver: #e0e0e0;
            --theme-main: var(--cyan-glow); --theme-dim: var(--cyan-dim);
            --starlight: rgba(255, 255, 255, 0.6);
            --dial-size: 65vh;
        }

        body { margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden; background-color: var(--void); background: radial-gradient(circle at center, #0a0f1a 0%, var(--void) 100%); color: var(--core-plat); font-family: 'JetBrains Mono', monospace; display: flex; justify-content: center; align-items: center; user-select: none; color-scheme: dark; perspective: 1500px; transform-style: preserve-3d; touch-action: manipulation; }
        
        #q-universal-modal { z-index: 999999 !important; }
        .radar-box, .opt-btn, .fmt-toggle { pointer-events: auto !important; position: relative; z-index: 100 !important; }

        /* SOLAR GLARE MASKING - Reduced mask, boosted opacity for wider starfield visibility */
        #stars { z-index: 1; opacity: 0.85; -webkit-mask-image: radial-gradient(circle at center, transparent 10%, black 35%); mask-image: radial-gradient(circle at center, transparent 10%, black 35%); }

        .global-header {
            position: absolute; top: 4vh; left: 0; width: 100vw;
            display: flex; justify-content: center; align-items: center; text-align: center;
            font-family: 'Courier New', Courier, monospace; font-weight: 900; font-size: 2.8rem; letter-spacing: 16px; padding-left: 16px;
            color: var(--theme-main); z-index: 50; pointer-events: none;
            text-shadow: 0 0 15px var(--theme-dim), 0 0 5px rgba(255, 255, 255, 0.5);
        }

        .v-head { position: absolute; white-space: nowrap; font-family: 'Orbitron'; font-weight: 900; font-size: 0.75rem; letter-spacing: 2px; margin: 0; padding: 0; z-index: 25; border: none; color: var(--theme-main); text-shadow: 0 0 10px var(--theme-dim); transition: color 0.3s, text-shadow 0.3s; }
        #quad-BIO .v-head, #quad-tl .v-head { bottom: -16px; right: 0; text-align: right; transform: translateX(8px); }
        #quad-COM .v-head, #quad-tr .v-head { bottom: -16px; left: 0; text-align: left; transform: translateX(-8px); }
        #quad-ENV .v-head, #quad-bl .v-head { top: -16px; right: 0; text-align: right; transform: translateX(8px); }
        #quad-MEC .v-head, #quad-br .v-head { top: -16px; left: 0; text-align: left; transform: translateX(-8px); }

        .t-row { display: flex; justify-content: space-between; width: 100%; font-size: 0.55rem; font-family: 'JetBrains Mono'; font-weight: 700; align-items: center;}
        .val-sm { font-family: 'Orbitron'; font-weight: 900; font-size: 0.6rem; z-index: 20; text-align: right; white-space: nowrap; color: var(--theme-main); text-shadow: 0 0 8px var(--theme-dim); text-transform: uppercase; }
        .panel-data-wrapper { position: relative; width: 280px; height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 4px; margin: 0 auto; z-index: 20; }
        .val-display { background: rgba(0,0,0,0.8); border: 1px solid var(--titanium); padding: 4px 8px; border-radius: 4px; box-shadow: inset 0 0 15px rgba(0,0,0,0.9); text-align: center; }

        #needle-hud { position: absolute; top: 12vh; left: 50%; transform: translateX(-50%); background: rgba(15, 23, 42, 0.9); border: 1px solid var(--titanium); padding: 8px 18px; font-family: 'Orbitron'; font-size: 0.75rem; font-weight: bold; border-radius: 4px; box-shadow: 0 0 20px rgba(0,0,0,0.8); z-index: 100; opacity: 0; transition: opacity 0.3s ease, border-color 0.3s ease; text-align: center; pointer-events: none; letter-spacing: 1px; color: #fff; }

        /* --- SOLAR SYSTEM ARCHITECTURE --- */
        .solar-system-wrapper { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: var(--dial-size); height: var(--dial-size); display: flex; justify-content: center; align-items: center; z-index: 5; pointer-events: none; }
        .solar-system-container { position: relative; width: 100%; height: 100%; transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1); transform-origin: center center; }
        
        .orbit-ring { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); border-radius: 50%; border: 1px dashed rgba(255,255,255,0.08); pointer-events: none; }
        .orbit-earth { border-color: rgba(0, 240, 255, 0.3); box-shadow: inset 0 0 20px rgba(0, 240, 255, 0.05), 0 0 20px rgba(0, 240, 255, 0.05); }

        .celestial-body { position: absolute; border-radius: 50%; display: flex; justify-content: center; align-items: center; pointer-events: auto; cursor: help; transform: translate(-50%, -50%); border: none; }
        
        /* Sun & Barycenter */
        #barycenter-crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 10px; height: 10px; pointer-events: auto; cursor: help; z-index: 30;}
        #barycenter-crosshair::before, #barycenter-crosshair::after { content: ''; position: absolute; background: var(--starlight); opacity: 0.5; }
        #barycenter-crosshair::before { top: 50%; left: -10px; width: 30px; height: 1px; transform: translateY(-50%); }
        #barycenter-crosshair::after { left: 50%; top: -10px; height: 30px; width: 1px; transform: translateX(-50%); }
        
        /* Realistic Fireball Sun */
        #sys-sun { 
            top: 50%; left: 50%; width: 8%; height: 8%; 
            background: radial-gradient(circle, #ffffff 10%, #ffcc00 40%, #ff4500 80%, #8b0000 100%); 
            box-shadow: 0 0 40px #ff9900, 0 0 80px rgba(255, 69, 0, 0.6); 
            z-index: 25; transition: transform 0.1s; 
            filter: url(#fireball-filter) drop-shadow(0 0 10px #ffcc00);
        }
        
        /* Solid Planets */
        .sys-mercury { width: 1.5%; height: 1.5%; background: #475569; box-shadow: 0 0 10px #475569; z-index: 20; }
        .sys-venus { width: 2.2%; height: 2.2%; background: #fef08a; box-shadow: 0 0 15px #fef08a; z-index: 20; }
        
        #earth-system { position: absolute; width: 0; height: 0; z-index: 25; pointer-events: none; }
        .sys-earth { width: 2.5vh; height: 2.5vh; background: #3b82f6; box-shadow: 0 0 20px #3b82f6; pointer-events: auto; }
        .sys-moon { position: absolute; width: 0.8vh; height: 0.8vh; background: #ffffff; border: 1px solid rgba(255,255,255,0.3); box-sizing: border-box; pointer-events: auto; transform: translate(-50%, -50%); transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1); }

        .sys-mars { width: 1.8%; height: 1.8%; background: #ef4444; box-shadow: 0 0 12px #ef4444; z-index: 15; opacity: 0; transition: opacity 0.5s; }
        .sys-jupiter { width: 10%; height: 10%; background: #f97316; box-shadow: 0 0 20px #f97316; z-index: 15; opacity: 0; transition: opacity 0.5s; }
        .sys-saturn { width: 8.5%; height: 8.5%; background: #eab308; box-shadow: 0 0 20px #eab308; z-index: 15; opacity: 0; transition: opacity 0.5s; }
        .saturn-rings { position: absolute; width: 220%; height: 20%; border-radius: 50%; border: 3px solid rgba(234, 179, 8, 0.8); transform: rotate(15deg); pointer-events: none; }
        .sys-uranus { width: 3.5%; height: 3.5%; background: #06b6d4; box-shadow: 0 0 15px #06b6d4; z-index: 15; opacity: 0; transition: opacity 0.5s; }
        .sys-neptune { width: 3.5%; height: 3.5%; background: #2563eb; box-shadow: 0 0 15px #2563eb; z-index: 15; opacity: 0; transition: opacity 0.5s; }

        /* Earth Orbital Nodes (Metallic Silver) */
        .celestial-marker { 
            position: absolute; 
            background: linear-gradient(135deg, #f8f9fa 0%, #a0a5ab 50%, #474b50 100%);
            -webkit-background-clip: text; color: transparent;
            font-family: 'Orbitron'; font-weight: 900; 
            filter: drop-shadow(0 0 8px rgba(255,255,255,0.6));
            z-index: 20; transform: translate(-50%, -50%); cursor: help; pointer-events: auto; 
        }
        .marker-solstice { font-size: 1.2rem; }
        .marker-equinox { font-size: 1.2rem; }
        .marker-apsis { font-size: 0.85rem; }

        /* Extra-Solar Stars */
        .extra-solar { position: absolute; color: #fff; font-size: 1.2rem; font-family: 'JetBrains Mono'; z-index: 10; pointer-events: auto; cursor: help; transform: translate(-50%, -50%); animation: twinkle 3s infinite alternate; }
        .es-1 { animation-delay: 0s; text-shadow: 0 0 15px #fff; }
        .es-2 { animation-delay: 1.5s; text-shadow: 0 0 10px #ffcccc; color: #ffcccc; font-size: 0.9rem;}
        .es-3 { animation-delay: 0.7s; text-shadow: 0 0 12px #ccffff; color: #ccffff; font-size: 1.0rem;}
        .es-4 { animation-delay: 2.1s; text-shadow: 0 0 8px #ffccff; color: #ffccff; font-size: 0.8rem;}

        @keyframes twinkle { 0% { opacity: 0.3; transform: translate(-50%, -50%) scale(0.8); } 100% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); } }

        /* MACRO LOGARITHMIC DILATION */
        .macro-active .solar-system-container { transform: scale(0.18); }
        .macro-active .sys-mars, .macro-active .sys-jupiter, .macro-active .sys-saturn, .macro-active .sys-uranus, .macro-active .sys-neptune { opacity: 1; }
        .macro-active .sys-earth { width: 5vh; height: 5vh; }
        .macro-active #sys-sun { width: 20%; height: 20%; }
        
        .macro-active .sys-jupiter { width: 35%; height: 35%; }
        .macro-active .sys-saturn { width: 28%; height: 28%; }
        .macro-active .sys-uranus { width: 15%; height: 15%; }
        .macro-active .sys-neptune { width: 15%; height: 15%; }
        
        .macro-active .celestial-marker { opacity: 0; }

        /* SCRUBBER */
        .q-astro-controls { position: fixed; bottom: calc(2.5vh + 60px); left: 50%; transform: translateX(-50%); z-index: 9995; background: rgba(10, 12, 18, 0.95); backdrop-filter: blur(20px); padding: 10px 25px; box-shadow: 0 10px 40px rgba(0,0,0,0.9), 0 0 20px rgba(255,255,255,0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; display: flex; flex-direction: column; gap: 10px; align-items: center; pointer-events: auto; }
        .astro-scrub-row { display: flex; justify-content: center; align-items: center; gap: 8px; width: 100%; }
        .btn-astro { background: rgba(0,0,0,0.6); border: 1px solid var(--cyan-glow); color: var(--cyan-glow); font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; padding: 6px 12px; cursor: pointer; border-radius: 4px; transition: all 0.2s; font-weight: bold; }
        .btn-astro:hover { background: var(--cyan-dim); color: #fff; }
        .btn-astro.active { background: var(--cyan-glow); color: #000; }
        .btn-macro-zoom { border-color: var(--gold); color: var(--gold); margin-left: 15px; }
        .btn-macro-zoom:hover { background: rgba(244, 208, 104, 0.2); }
        .btn-macro-zoom.active { background: var(--gold); color: #000; }
    </style>
</head>
<body class="mode-q">

    <svg width="0" height="0" style="position:absolute;z-index:-1;">
        <defs>
            <filter id="fireball-filter">
                <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="4" result="noise">
                    <animate attributeName="baseFrequency" values="0.08;0.1;0.08" dur="3s" repeatCount="indefinite"/>
                </feTurbulence>
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="8" xChannelSelector="R" yChannelSelector="G"/>
            </filter>
        </defs>
    </svg>

    <div class="global-header desktop-only">ASTROPHYSICAL</div>
    <div class="star-container" id="stars"></div>
    <div id="needle-hud">SYSTEMIC CONTEXT</div>

    <div class="solar-system-wrapper q-center-dial">
        
        <div class="extra-solar es-1" style="top: 8%; left: 88%;" onmouseover="showNeedleHUD('Alpha Centauri System (~4.37 ly)', 'var(--starlight)')" onmouseout="hideNeedleHUD()">✦</div>
        <div class="extra-solar es-2" style="top: 85%; left: 15%;" onmouseover="showNeedleHUD('Barnard&#39;s Star (~5.96 ly)', 'var(--starlight)')" onmouseout="hideNeedleHUD()">✦</div>
        <div class="extra-solar es-3" style="top: 12%; left: 12%;" onmouseover="showNeedleHUD('Wolf 359 (~7.86 ly)', 'var(--starlight)')" onmouseout="hideNeedleHUD()">✦</div>
        <div class="extra-solar es-4" style="top: 80%; left: 90%;" onmouseover="showNeedleHUD('Lalande 21185 (~8.31 ly)', 'var(--starlight)')" onmouseout="hideNeedleHUD()">✦</div>

        <div class="solar-system-container" id="sys-container">
            
            <div class="orbit-ring orbit-earth" style="width: 50%; height: 50%;"></div>
            <div class="orbit-ring" style="width: 76%; height: 76%;"></div> <div class="orbit-ring" style="width: 160%; height: 160%;"></div> <div class="orbit-ring" style="width: 280%; height: 280%;"></div> <div class="orbit-ring" style="width: 400%; height: 400%;"></div> <div class="orbit-ring" style="width: 520%; height: 520%;"></div> <div class="celestial-marker marker-solstice" id="node-south" onmouseover="showNeedleHUD('SOUTHERN SOLSTICE (0.000°)', 'var(--silver)')" onmouseout="hideNeedleHUD()" onclick="openAnchorModal('ALPHA')">◓</div>
            <div class="celestial-marker marker-equinox" id="node-eq1" onmouseover="showNeedleHUD('1ST EQUINOX (90.000°)', 'var(--silver)')" onmouseout="hideNeedleHUD()" onclick="openAnchorModal('BETA')">◐</div>
            <div class="celestial-marker marker-solstice" id="node-north" onmouseover="showNeedleHUD('NORTHERN SOLSTICE (180.000°)', 'var(--silver)')" onmouseout="hideNeedleHUD()" onclick="openAnchorModal('GAMMA')">◒</div>
            <div class="celestial-marker marker-equinox" id="node-eq2" onmouseover="showNeedleHUD('2ND EQUINOX (270.000°)', 'var(--silver)')" onmouseout="hideNeedleHUD()" onclick="openAnchorModal('DELTA')">◑</div>
            
            <div class="celestial-marker marker-apsis" id="node-peri" onmouseover="showNeedleHUD('PERIHELION (14.00°): Minimum Spatial Distance.', 'var(--silver)')" onmouseout="hideNeedleHUD()">▲</div>
            <div class="celestial-marker marker-apsis" id="node-aph" onmouseover="showNeedleHUD('APHELION (194.00°): Maximum Spatial Distance.', 'var(--silver)')" onmouseout="hideNeedleHUD()">▼</div>

            <div id="barycenter-crosshair" onmouseover="showNeedleHUD('SSB: SOLAR SYSTEM BARYCENTER', 'var(--starlight)')" onmouseout="hideNeedleHUD()"></div>
            <div class="celestial-body" id="sys-sun" onmouseover="showNeedleHUD('SOLAR MASS (GRAVITATIONAL WOBBLE)', 'var(--gold)')" onmouseout="hideNeedleHUD()"></div>
            
            <div class="celestial-body sys-mercury" id="p-mercury" onmouseover="showNeedleHUD('MERCURY', '#64748b')" onmouseout="hideNeedleHUD()"></div>
            <div class="celestial-body sys-venus" id="p-venus" onmouseover="showNeedleHUD('VENUS', '#fef08a')" onmouseout="hideNeedleHUD()"></div>
            
            <div id="earth-system">
                <div class="celestial-body sys-earth" id="p-earth" onmouseover="showNeedleHUD('EARTH', '#3b82f6')" onmouseout="hideNeedleHUD()"></div>
                <div class="celestial-body sys-moon" id="p-moon" onmouseover="showNeedleHUD('LUNA (Synodic Phase)', '#ffffff')" onmouseout="hideNeedleHUD()"></div>
            </div>

            <div class="celestial-body sys-mars" id="p-mars" onmouseover="showNeedleHUD('MARS', '#ef4444')" onmouseout="hideNeedleHUD()"></div>
            <div class="celestial-body sys-jupiter" id="p-jupiter" onmouseover="showNeedleHUD('JUPITER', '#f97316')" onmouseout="hideNeedleHUD()"></div>
            <div class="celestial-body sys-saturn" id="p-saturn" onmouseover="showNeedleHUD('SATURN', '#eab308')" onmouseout="hideNeedleHUD()"><div class="saturn-rings"></div></div>
            <div class="celestial-body sys-uranus" id="p-uranus" onmouseover="showNeedleHUD('URANUS', '#06b6d4')" onmouseout="hideNeedleHUD()"></div>
            <div class="celestial-body sys-neptune" id="p-neptune" onmouseover="showNeedleHUD('NEPTUNE', '#2563eb')" onmouseout="hideNeedleHUD()"></div>

        </div>
    </div>

</body>
</html>
