<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>THE QUADRATURE // ASTROPHYSICAL VECTOR</title>
    
    <script src="q-ui.js"></script>
    <script src="q-core.js"></script>
    <script src="q-planner.js"></script>
    <script src="q-hub.js"></script>
    <script src="astrophysical.js?v=24.0"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=JetBrains+Mono:wght@100;400;700;800&display=swap');

        :root {
            --void: #030406; --core-plat: #e2e8f0; --core-dim: rgba(226, 232, 240, 0.15); --core-glow: rgba(226, 232, 240, 0.4);
            --cyan-glow: #00f0ff; --cyan-dim: rgba(0, 240, 255, 0.2); --cyan-dark: #0088aa;
            --magenta-glow: #ff003c; --magenta-dim: rgba(255, 0, 60, 0.2); --magenta-dark: #880020;
            --titanium: #334155; --carbon: #0f172a; --steel: #64748b;
            --theme-main: var(--cyan-glow); --theme-dim: var(--cyan-dim); --gold: #F4D068;
            --starlight: rgba(255, 255, 255, 0.6);
            --dial-size: 45vh; 
        }

        body { margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden; background-color: var(--void); background: radial-gradient(circle at center, #0a0f1a 0%, var(--void) 85%); color: var(--core-plat); font-family: 'JetBrains Mono', monospace; display: flex; justify-content: center; align-items: center; user-select: none; color-scheme: dark; perspective: 1500px; transform-style: preserve-3d; touch-action: manipulation; }
        
        #q-universal-modal { z-index: 999999 !important; }
        .orbit-node { pointer-events: auto !important; position: relative; z-index: 100 !important; }

        .matrix-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; background-image: linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; }
        #stars { z-index: 1; }

        .global-header {
            position: absolute; top: 4vh; left: 0; width: 100vw;
            display: flex; justify-content: center; align-items: center; text-align: center;
            font-family: 'Courier New', Courier, monospace; font-weight: 900; font-size: 2.8rem; letter-spacing: 16px; padding-left: 16px;
            color: var(--theme-main); z-index: 50; pointer-events: none;
            text-shadow: 0 0 15px var(--theme-dim), 0 0 5px rgba(255, 255, 255, 0.5);
        }

        .v-head { 
            position: absolute; white-space: nowrap;
            font-family: 'Orbitron'; font-weight: 900; font-size: 0.75rem; letter-spacing: 2px; 
            margin: 0; padding: 0; z-index: 25; border: none;
            color: var(--theme-main);
            text-shadow: 0 0 10px var(--theme-dim);
            transition: color 0.3s, text-shadow 0.3s;
        }
        
        #quad-tl .v-head { bottom: -16px; right: 0; text-align: right; transform: translateX(8px); }
        #quad-tr .v-head { bottom: -16px; left: 0; text-align: left; transform: translateX(-8px); }
        #quad-bl .v-head { top: -16px; right: 0; text-align: right; transform: translateX(8px); }
        #quad-br .v-head { top: -16px; left: 0; text-align: left; transform: translateX(-8px); }

        .t-row { display: flex; justify-content: space-between; width: 100%; font-size: 0.55rem; font-family: 'JetBrains Mono'; font-weight: 700; align-items: center;}
        .val-sm { font-family: 'Orbitron'; font-weight: 900; font-size: 0.6rem; z-index: 20; text-align: right; white-space: nowrap; color: var(--theme-main); text-shadow: 0 0 8px var(--theme-dim); text-transform: uppercase; }

        .panel-data-wrapper { position: relative; width: 280px; height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 4px; margin: 0 auto; z-index: 20; }
        
        #needle-hud { position: absolute; top: 12vh; left: 50%; transform: translateX(-50%); background: rgba(15, 23, 42, 0.9); border: 1px solid var(--titanium); padding: 8px 18px; font-family: 'Orbitron'; font-size: 0.75rem; font-weight: bold; border-radius: 4px; box-shadow: 0 0 20px rgba(0,0,0,0.8); z-index: 100; opacity: 0; transition: opacity 0.3s ease, border-color 0.3s ease; text-align: center; pointer-events: none; letter-spacing: 1px; color: #fff; max-width: 80vw; }

        /* --- BARYCENTRIC VISUALIZER CSS --- */
        .bary-container { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: var(--dial-size); height: var(--dial-size); z-index: 5; pointer-events: none; }
        .bary-svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 0 10px rgba(0,240,255,0.1)); pointer-events: none; }
        
        .orbit-path { fill: none; stroke: var(--titanium); stroke-width: 1; stroke-dasharray: 4 4; opacity: 0.5; }
        .orbit-path-earth { stroke: var(--cyan-glow); opacity: 0.4; }
        
        .barycenter { fill: var(--magenta-glow); filter: drop-shadow(0 0 8px var(--magenta-glow)); }
        .solar-core { fill: #F4D068; filter: drop-shadow(0 0 15px #F4D068); }
        
        .orbit-node { cursor: crosshair; transition: all 0.2s ease; pointer-events: auto; }
        .orbit-node:hover { stroke: #fff; stroke-width: 2; filter: drop-shadow(0 0 10px #fff); }

        .earth-node { fill: var(--cyan-glow); filter: drop-shadow(0 0 8px var(--cyan-glow)); }
        .lunar-node { fill: var(--core-plat); filter: drop-shadow(0 0 4px #fff); }
        .inner-planet { fill: var(--steel); }

        .connecting-line { fill: none; stroke: rgba(255,255,255,0.2); stroke-width: 0.5; }
    </style>
</head>
<body class="mode-q">

    <div class="global-header desktop-only">ASTROPHYSICAL</div>

    <div class="matrix-layer"></div>
    <div class="star-container" id="stars"></div>
    <div id="needle-hud">SYSTEMIC CONTEXT</div>

    <div class="bary-container q-center-dial" id="bary-root">
        <svg class="bary-svg" viewBox="-100 -100 200 200" preserveAspectRatio="xMidYMid meet">
            <line x1="-100" y1="0" x2="100" y2="0" stroke="rgba(51, 65, 85, 0.3)" stroke-width="0.5" />
            <line x1="0" y1="-100" x2="0" y2="100" stroke="rgba(51, 65, 85, 0.3)" stroke-width="0.5" />
            
            <circle cx="0" cy="0" r="30" class="orbit-path" /> 
            <circle cx="0" cy="0" r="55" class="orbit-path" /> 
            <circle cx="0" cy="0" r="85" class="orbit-path orbit-path-earth" /> 

            <circle cx="0" cy="0" r="1.5" class="barycenter orbit-node" 
                onmouseover="showNeedleHUD('SOLAR SYSTEM BARYCENTER (SSB): The true center of mass. The Sun orbits this coordinate.', 'var(--magenta-glow)')" 
                onmouseout="hideNeedleHUD()" />

            <circle id="svg-sun" cx="-2" cy="1" r="8" class="solar-core orbit-node" 
                onmouseover="showNeedleHUD('SOLAR CORE: Offset from the Barycenter due to the gravitational pull of Jovian mass.', '#F4D068')" 
                onmouseout="hideNeedleHUD()" />

            <circle id="svg-mercury" cx="21.2" cy="-21.2" r="2" class="inner-planet orbit-node" 
                onmouseover="showNeedleHUD('MERCURY: Inner Kinematics', 'var(--steel)')" onmouseout="hideNeedleHUD()" />
            <circle id="svg-venus" cx="-45" cy="-31" r="3" class="inner-planet orbit-node" 
                onmouseover="showNeedleHUD('VENUS: Inner Kinematics', 'var(--steel)')" onmouseout="hideNeedleHUD()" />
            
            <g id="svg-earth-group" transform="translate(60, 60)">
                <circle cx="0" cy="0" r="4" class="earth-node orbit-node" 
                    onmouseover="showNeedleHUD('EARTH: Current Orbital Coordinate', 'var(--cyan-glow)')" onmouseout="hideNeedleHUD()" />
                <circle cx="0" cy="0" r="10" class="orbit-path" style="stroke-opacity: 0.8;" /> 
                <circle id="svg-moon" cx="7" cy="7" r="1.5" class="lunar-node orbit-node" 
                    onmouseover="showNeedleHUD('THE MOON: Current Phase & Orbital Distance', '#fff')" onmouseout="hideNeedleHUD()" />
                <line x1="0" y1="0" x2="7" y2="7" class="connecting-line" id="svg-lunar-line" />
            </g>
            
            <line x1="0" y1="0" x2="60" y2="60" class="connecting-line" id="svg-earth-vector" stroke="var(--cyan-dim)" />
        </svg>
    </div>

</body>
</html>
