<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>THE QUADRATURE // ASTROPHYSICAL VECTOR</title>
    
    <script src="q-ui.js"></script>
    <script src="q-core.js"></script>
    <script src="q-planner.js"></script>
    <script src="q-hub.js"></script>
    <script src="astrophysical.js?v=25.2"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=JetBrains+Mono:wght@100;400;700;800&display=swap');

        :root {
            --void: #030406; --core-plat: #e2e8f0; --core-dim: rgba(226, 232, 240, 0.15); --core-glow: rgba(226, 232, 240, 0.4);
            --cyan-glow: #00f0ff; --cyan-dim: rgba(0, 240, 255, 0.2); --cyan-dark: #0088aa;
            --magenta-glow: #ff003c; --magenta-dim: rgba(255, 0, 60, 0.2); --magenta-dark: #880020;
            --titanium: #334155; --carbon: #0f172a; --steel: #64748b;
            --theme-main: var(--cyan-glow); --theme-dim: var(--cyan-dim); --gold: #F4D068;
            --starlight: rgba(255, 255, 255, 0.6);
            --dial-size: 55vh; 
        }

        body { margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden; background-color: var(--void); background: radial-gradient(circle at center, #0a0f1a 0%, var(--void) 85%); color: var(--core-plat); font-family: 'JetBrains Mono', monospace; display: flex; justify-content: center; align-items: center; user-select: none; color-scheme: dark; perspective: 1500px; transform-style: preserve-3d; touch-action: manipulation; }
        
        #q-universal-modal { z-index: 999999 !important; }
        .orbit-node { pointer-events: auto !important; position: relative; z-index: 100 !important; cursor: crosshair; transition: all 0.2s ease; }
        .orbit-node:hover { filter: brightness(1.3) drop-shadow(0 0 12px #fff); }

        .matrix-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; background-image: linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; }
        #stars { z-index: 1; }

        .global-header {
            position: absolute; top: 4vh; left: 0; width: 100vw;
            display: flex; justify-content: center; align-items: center; text-align: center;
            font-family: 'Courier New', Courier, monospace; font-weight: 900; font-size: 2.8rem; letter-spacing: 16px; padding-left: 16px;
            color: var(--theme-main); z-index: 50; pointer-events: none;
            text-shadow: 0 0 15px var(--theme-dim), 0 0 5px rgba(255, 255, 255, 0.5);
        }

        /* --- CORNER QUADRANT CONTAINERS --- */
        .corner-panel { position: absolute; width: 280px; height: 120px; z-index: 20; pointer-events: auto; }
        #quad-tl { top: 12vh; left: 4vw; }
        #quad-tr { top: 12vh; right: 4vw; }
        #quad-bl { bottom: 8vh; left: 4vw; }
        #quad-br { bottom: 8vh; right: 4vw; }

        .v-head { 
            position: absolute; white-space: nowrap;
            font-family: 'Orbitron'; font-weight: 900; font-size: 0.75rem; letter-spacing: 2px; 
            margin: 0; padding: 0; z-index: 25; border: none;
            color: var(--theme-main);
            text-shadow: 0 0 10px var(--theme-dim);
            transition: color 0.3s, text-shadow 0.3s;
        }
        
        #quad-tl .v-head { bottom: -16px; right: 0; text-align: right; transform: translateX(8px); }
        #quad-tr .v-head { bottom: -16px; left: 0; text-align: left; transform: translateX(-8px); }
        #quad-bl .v-head { top: -16px; right: 0; text-align: right; transform: translateX(8px); }
        #quad-br .v-head { top: -16px; left: 0; text-align: left; transform: translateX(-8px); }

        .t-row { display: flex; justify-content: space-between; width: 100%; font-size: 0.55rem; font-family: 'JetBrains Mono'; font-weight: 700; align-items: center;}
        .val-sm { font-family: 'Orbitron'; font-weight: 900; font-size: 0.6rem; z-index: 20; text-align: right; white-space: nowrap; color: var(--theme-main); text-shadow: 0 0 8px var(--theme-dim); text-transform: uppercase; }

        .panel-data-wrapper { position: relative; width: 280px; height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 4px; margin: 0 auto; z-index: 20; }
        
        /* DYNAMIC CURSOR TOOLTIP */
        #astro-tooltip { position: fixed; background: rgba(10, 15, 25, 0.95); border: 1px solid var(--titanium); border-left: 2px solid var(--cyan-glow); padding: 8px 12px; font-family: 'JetBrains Mono'; font-size: 0.55rem; color: #fff; border-radius: 4px; box-shadow: 0 0 15px rgba(0,0,0,0.8); z-index: 9999; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; white-space: pre-wrap; line-height: 1.4; max-width: 250px; }

        /* OPT Node Styling */
        .opt-oval { position: absolute; width: 60px; height: 30px; border: 1px solid var(--titanium); border-radius: 15px; display: flex; justify-content: center; align-items: center; z-index: 50; cursor: pointer; background: rgba(0,0,0,0.5); transition: 0.2s; font-family: 'Orbitron'; font-size: 0.65rem; font-weight: 900; color: var(--steel); letter-spacing: 1px; }
        .opt-oval:hover { border-color: var(--cyan-glow); color: var(--cyan-glow); box-shadow: inset 0 0 10px var(--cyan-dim), 0 0 10px var(--cyan-dim); }
        
        #opt-tl { top: -20px; right: 0; }
        #opt-tr { top: -20px; left: 0; }
        #opt-bl { bottom: -20px; right: 0; }
        #opt-br { bottom: -20px; left: 0; }

        /* --- BARYCENTRIC VISUALIZER CSS --- */
        .bary-container { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: var(--dial-size); height: var(--dial-size); z-index: 5; pointer-events: none; }
        .bary-svg { width: 100%; height: 100%; overflow: visible; pointer-events: none; }
        
        #macro-zoom-group { transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1); transform-origin: 0 0; }
        
        .orbit-path { display: none; } /* ERADICATED ORBITAL LINES */
        
        /* --- SCRUBBER PANEL --- */
        .q-scrubber-panel { position: absolute; bottom: 3vh; left: 50%; transform: translateX(-50%); width: 400px; display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 100; pointer-events: auto; }
        .scrub-row-1 { display: flex; gap: 10px; align-items: center; }
        .macro-micro-group { display: flex; background: rgba(0,0,0,0.6); border: 1px solid var(--titanium); border-radius: 4px; overflow: hidden; }
        .btn-micro { background: transparent; border: none; border-right: 1px solid var(--titanium); color: var(--steel); font-family: 'Orbitron'; font-size: 0.7rem; font-weight: bold; padding: 6px 12px; cursor: pointer; transition: 0.2s; }
        .btn-micro:last-child { border-right: none; }
        .btn-micro:hover { background: var(--core-dim); color: #fff; }
        .btn-micro.active { color: var(--cyan-glow); text-shadow: 0 0 8px var(--cyan-glow); background: rgba(0, 240, 255, 0.1); }
    </style>
</head>
<body class="mode-q">

    <div class="global-header desktop-only">ASTROPHYSICAL</div>

    <div class="matrix-layer"></div>
    <div class="star-container" id="stars"></div>
    
    <div id="astro-tooltip"></div>

    <div id="quad-tl" class="corner-panel"><div id="opt-tl" class="opt-oval">OPT</div></div>
    <div id="quad-tr" class="corner-panel"><div id="opt-tr" class="opt-oval">OPT</div></div>
    <div id="quad-bl" class="corner-panel"><div id="opt-bl" class="opt-oval">OPT</div></div>
    <div id="quad-br" class="corner-panel"><div id="opt-br" class="opt-oval">OPT</div></div>

    <div class="bary-container q-center-dial" id="bary-root">
        <svg class="bary-svg" viewBox="-120 -120 240 240" preserveAspectRatio="xMidYMid meet">
            <defs>
                <radialGradient id="void-mask" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#030406" stop-opacity="0.95" />
                    <stop offset="70%" stop-color="#030406" stop-opacity="0.8" />
                    <stop offset="100%" stop-color="#030406" stop-opacity="0" />
                </radialGradient>

                <radialGradient id="grad-sun" cx="40%" cy="40%" r="60%">
                    <stop offset="0%" stop-color="#ffffff" />
                    <stop offset="20%" stop-color="#fff5cc" />
                    <stop offset="60%" stop-color="#f59e0b" />
                    <stop offset="90%" stop-color="#dc2626" />
                    <stop offset="100%" stop-color="#7f1d1d" />
                </radialGradient>

                <filter id="glow-sun" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="3" result="blur1" />
                    <feGaussianBlur stdDeviation="8" result="blur2" />
                    <feMerge>
                        <feMergeNode in="blur2" />
                        <feMergeNode in="blur1" />
                        <feMergeNode in="SourceGraphic" />
                    </feMerge>
                </filter>

                <radialGradient id="grad-earth" cx="35%" cy="35%" r="65%">
                    <stop offset="0%" stop-color="#e0f2fe" />
                    <stop offset="30%" stop-color="#38bdf8" />
                    <stop offset="70%" stop-color="#0284c7" />
                    <stop offset="100%" stop-color="#082f49" />
                </radialGradient>

                <radialGradient id="grad-moon" cx="30%" cy="30%" r="70%">
                    <stop offset="0%" stop-color="#ffffff" />
                    <stop offset="40%" stop-color="#d1d5db" />
                    <stop offset="100%" stop-color="#4b5563" />
                </radialGradient>

                <radialGradient id="grad-venus" cx="35%" cy="35%" r="65%">
                    <stop offset="0%" stop-color="#fef3c7" />
                    <stop offset="50%" stop-color="#d97706" />
                    <stop offset="100%" stop-color="#78350f" />
                </radialGradient>

                <radialGradient id="grad-mercury" cx="30%" cy="30%" r="70%">
                    <stop offset="0%" stop-color="#9ca3af" />
                    <stop offset="60%" stop-color="#4b5563" />
                    <stop offset="100%" stop-color="#111827" />
                </radialGradient>

                <radialGradient id="grad-jupiter" cx="40%" cy="40%" r="60%">
                    <stop offset="0%" stop-color="#ffedd5" />
                    <stop offset="30%" stop-color="#fdba74" />
                    <stop offset="60%" stop-color="#c2410c" />
                    <stop offset="100%" stop-color="#431407" />
                </radialGradient>

                <radialGradient id="grad-saturn" cx="40%" cy="40%" r="60%">
                    <stop offset="0%" stop-color="#fef08a" />
                    <stop offset="50%" stop-color="#ca8a04" />
                    <stop offset="100%" stop-color="#713f12" />
                </radialGradient>
            </defs>

            <line x1="-1000" y1="0" x2="1000" y2="0" stroke="rgba(51, 65, 85, 0.3)" stroke-width="0.5" />
            <line x1="0" y1="-1000" x2="0" y2="1000" stroke="rgba(51, 65, 85, 0.3)" stroke-width="0.5" />
            
            <g id="macro-zoom-group" transform="scale(1)">
                <circle cx="0" cy="0" r="150" fill="url(#void-mask)" />

                <g opacity="0.4">
                    <circle cx="-600" cy="-300" r="4" fill="#bae6fd" />
                    <circle cx="500" cy="-700" r="3" fill="#fef08a" />
                    <circle cx="700" cy="400" r="5" fill="#fca5a5" />
                    <circle cx="-400" cy="800" r="3" fill="#e0e7ff" />
                </g>

                <g class="orbit-node" transform="translate(82.8, 18.8)" onmouseover="showAstroTooltip('PERIHELION\\nClosest distance to Solar Core.\\nMaximum orbital velocity friction.', '#f97316')" onmouseout="hideAstroTooltip()">
                    <polygon points="0,-4 4,0 0,4 -4,0" fill="#f97316" stroke="#ea580c" stroke-width="0.5" />
                </g>
                <g class="orbit-node" transform="translate(-82.8, -18.8)" onmouseover="showAstroTooltip('APHELION\\nFurthest distance from Solar Core.\\nMinimum orbital velocity friction.', '#9ca3af')" onmouseout="hideAstroTooltip()">
                    <line x1="-4" y1="0" x2="4" y2="0" stroke="#9ca3af" stroke-width="1.5" />
                    <line x1="0" y1="-4" x2="0" y2="4" stroke="#9ca3af" stroke-width="1.5" />
                </g>

                <circle cx="0" cy="0" r="2.5" fill="#000" stroke="var(--magenta-glow)" stroke-width="1" class="orbit-node" 
                    onmouseover="showAstroTooltip('SOLAR SYSTEM BARYCENTER (SSB)\\nThe true center of mass for the entire system, dynamically tracking the Jovian influence. The Sun will be shown slightly offset from this coordinate, dynamically orbiting it in the macro cycle.', 'var(--magenta-glow)')" 
                    onmouseout="hideAstroTooltip()" />

                <circle id="svg-sun" cx="-2" cy="1" r="16" fill="url(#grad-sun)" filter="url(#glow-sun)" class="orbit-node" 
                    onmouseover="showAstroTooltip('SOLAR CORE\\nOffset from the Barycenter.', '#F4D068')" 
                    onmouseout="hideAstroTooltip()" />

                <circle id="svg-mercury" cx="21.2" cy="-21.2" r="3" fill="url(#grad-mercury)" class="orbit-node" 
                    onmouseover="showAstroTooltip('MERCURY: Inner Kinematics\\n88 Day Orbital Period.\\nAcceleration tracking engaged.', '#9ca3af')" onmouseout="hideAstroTooltip()" />
                
                <circle id="svg-venus" cx="-45" cy="-31" r="4.5" fill="url(#grad-venus)" class="orbit-node" 
                    onmouseover="showAstroTooltip('VENUS: Inner Kinematics\\n225 Day Orbital Period.\\nTrue anomaly data active.', '#fbbf24')" onmouseout="hideAstroTooltip()" />

                <circle id="svg-jupiter" cx="0" cy="-442" r="22" fill="url(#grad-jupiter)" class="orbit-node" 
                    onmouseover="showAstroTooltip('JUPITER\\nPrimary gravitational driver of the Solar System Barycenter.', '#ea580c')" onmouseout="hideAstroTooltip()" />

                <circle id="svg-saturn" cx="0" cy="-807" r="18" fill="url(#grad-saturn)" class="orbit-node" 
                    onmouseover="showAstroTooltip('SATURN\\nSecondary gravitational driver of the SSB.', '#fef08a')" onmouseout="hideAstroTooltip()" />

                <g id="svg-earth-group" transform="translate(85, 0)">
                    <circle cx="0" cy="0" r="7" fill="url(#grad-earth)" class="orbit-node" 
                        onmouseover="showAstroTooltip('EARTH: Current Orbital Coordinate\\nYour present kinematic invariant.', 'var(--cyan-glow)')" onmouseout="hideAstroTooltip()" />
                    
                    <circle id="svg-moon" cx="12" cy="12" r="2.5" fill="url(#grad-moon)" class="orbit-node" 
                        onmouseover="showAstroTooltip('THE MOON: Current Phase & Orbital Distance\\nBiometric integration pathway.', '#e5e7eb')" onmouseout="hideAstroTooltip()" />
                    </g>
            </g>
        </svg>
    </div>

</body>
</html>
